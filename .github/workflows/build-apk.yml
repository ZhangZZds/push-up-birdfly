name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (API 34 / Android 14+)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: 🔨 Build Web Production Bundle
        run: npm run build

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🤖 Build Android APK (assembleDebug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 🏷️ Rename APK for Distribution
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/push-up-bird-v1.0.2.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/push-up-bird-v1.0.1.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/push-up-bird-v1.0.0.apk
          echo "APK generated successfully:"
          ls -lh release-output/

      - name: 📤 Upload APK Artifact to GitHub Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: push-up-bird-v1.0.2-apk
          path: release-output/

      - name: 🚀 Publish/Update GitHub Release (v1.0.2)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view v1.0.2 >/dev/null 2>&1; then
            gh release create v1.0.2 release-output/push-up-bird-v1.0.2.apk \
              --title "v1.0.2 - 荣耀GT Pro / 安卓16 摄像头硬件激活专项修复" \
              --notes "## 🚀 v1.0.2 更新内容
              - 修复荣耀 GT Pro / Android 16 (MagicOS 9) 下摄像头硬件无法唤醒的问题
              - 消除 Chromium 对隐藏 offscreen video 的电源挂起（挂载真实可见视口 DOM video 元素）
              - 权限精简与原生同步放行：移除无用音频录音权限，避免系统权限冲突，原生 WebChromeClient 权限即时确认
              - 增加首触自动激活解锁（Touch / Click Autoplay Policy Unlock），解决沙盒策略拦截
              - 优化摄像头降级阶梯，向下兼容多层级移动端约束参数"
          else
            gh release upload v1.0.2 release-output/push-up-bird-v1.0.2.apk --clobber
          fi
          gh release upload v1.0.1 release-output/push-up-bird-v1.0.1.apk --clobber || true
          gh release upload v1.0.0 release-output/push-up-bird-v1.0.0.apk --clobber || true
