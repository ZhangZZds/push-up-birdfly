name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (API 34 / Android 14+)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: 🔨 Build Web Production Bundle
        run: npm run build

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🤖 Build Android APK (assembleDebug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 🏷️ Rename APK for Distribution
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/push-up-bird-v1.0.4.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/push-up-bird-v1.0.3.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/push-up-bird-v1.0.2.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/push-up-bird-v1.0.1.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/push-up-bird-v1.0.0.apk
          echo "APK generated successfully:"
          ls -lh release-output/

      - name: 📤 Upload APK Artifact to GitHub Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: push-up-bird-v1.0.4-apk
          path: release-output/

      - name: 🚀 Publish/Update GitHub Release (v1.0.4)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view v1.0.4 >/dev/null 2>&1; then
            gh release create v1.0.4 release-output/push-up-bird-v1.0.4.apk \
              --title "v1.0.4 - 荣耀 MagicOS 9 / Android 16 原生摄像头权限链路彻底打通" \
              --notes "## 🚀 v1.0.4 更新内容
              - 彻底解决荣耀 GT Pro (MagicOS 9 / Android 16) 摄像头不启动、状态栏不显示绿色隐私圆点的问题
              - 接入 @capacitor/camera 原生系统权限通道，在调用 getUserMedia 前主动向系统申请并等待授权确认
              - 重构 MainActivity 原生 WebChromeClient：精准拦截 VIDEO_CAPTURE，原生权限就绪即时放行，未授权自动弹起系统授权窗
              - 新增原生应用设置跳转桥梁（NativeAndroid.openAppSettings），权限被拒时支持一键直达系统设置开启
              - 消除首次触屏重启摄像头导致的 HAL 硬件锁竞争，优化 DOM video 实体直通渲染管道"
          else
            gh release upload v1.0.4 release-output/push-up-bird-v1.0.4.apk --clobber
          fi
          gh release upload v1.0.3 release-output/push-up-bird-v1.0.3.apk --clobber || true
          gh release upload v1.0.2 release-output/push-up-bird-v1.0.2.apk --clobber || true
          gh release upload v1.0.1 release-output/push-up-bird-v1.0.1.apk --clobber || true
          gh release upload v1.0.0 release-output/push-up-bird-v1.0.0.apk --clobber || true
