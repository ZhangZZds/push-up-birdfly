name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (API 34 / Android 14+)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: 🔨 Build Web Production Bundle
        run: npm run build

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🤖 Build Android APK (assembleDebug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 🏷️ Rename APK for Distribution
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/push-up-bird-v1.0.3.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/push-up-bird-v1.0.2.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/push-up-bird-v1.0.1.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/push-up-bird-v1.0.0.apk
          echo "APK generated successfully:"
          ls -lh release-output/

      - name: 📤 Upload APK Artifact to GitHub Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: push-up-bird-v1.0.3-apk
          path: release-output/

      - name: 🚀 Publish/Update GitHub Release (v1.0.3)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view v1.0.3 >/dev/null 2>&1; then
            gh release create v1.0.3 release-output/push-up-bird-v1.0.3.apk \
              --title "v1.0.3 - 应用图标全方位美化与高能健身吉祥物重磅升级" \
              --notes "## 🚀 v1.0.3 更新内容
              - 重磅升级高能健身吉祥物应用图标（3D 肌肉小鸟 + 运动吸汗发带 + 炫彩暗夜霓虹渐变）
              - 适配 Android 8~16 (含荣耀 MagicOS 9 / Android 16) 原生自适应矢量图标 (Adaptive Icons: mipmap-anydpi-v26)
              - 彻底告别旧版安卓系统强制添加的白色圆底外边框与模糊拉伸问题
              - 生成完整全密度图层（mdpi, hdpi, xhdpi, xxhdpi, xxxhdpi 以及圆角/圆形独立图标）
              - 网页端与 PWA 增强：生成超清 512px Logo、高精 Favicon (16/32/64px)、Apple Touch Icon (180px) 及全新精雕矢量 SVG
              - 游戏内界面美化：顶部状态栏增加全新品牌 Logo 徽章，设置面板与训练结算面板嵌入专属吉祥物"
          else
            gh release upload v1.0.3 release-output/push-up-bird-v1.0.3.apk --clobber
          fi
          gh release upload v1.0.2 release-output/push-up-bird-v1.0.2.apk --clobber || true
          gh release upload v1.0.1 release-output/push-up-bird-v1.0.1.apk --clobber || true
          gh release upload v1.0.0 release-output/push-up-bird-v1.0.0.apk --clobber || true
