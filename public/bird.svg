<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="headbandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Body -->
  <circle cx="30" cy="34" r="20" fill="url(#bodyGrad)" filter="url(#shadow)"/>
  
  <!-- Belly -->
  <ellipse cx="27" cy="40" rx="14" ry="11" fill="url(#bellyGrad)" opacity="0.9"/>

  <!-- Athletic Sweatband on Head -->
  <path d="M 12 25 Q 28 17 46 22 L 48 26 Q 28 21 13 29 Z" fill="url(#headbandGrad)" stroke="#B91C1C" stroke-width="0.8"/>

  <!-- Big Determined Eye -->
  <circle cx="39" cy="28" r="6.5" fill="#FFFFFF"/>
  <circle cx="41" cy="28" r="3.6" fill="#18181B"/>
  <circle cx="42.5" cy="26.5" r="1.5" fill="#FFFFFF"/>

  <!-- Beak -->
  <path d="M 38 33 Q 54 36 56 38 Q 48 43 36 41 Z" fill="url(#beakGrad)" stroke="#B45309" stroke-width="1"/>

  <!-- Flexed Wing -->
  <path d="M 13 36 C 9 28, 22 26, 26 34 C 28 38, 20 45, 13 36 Z" fill="url(#wingGrad)" stroke="#C2410C" stroke-width="1.2" filter="url(#shadow)"/>
  <!-- Wing Feathers / Detail -->
  <path d="M 16 33 Q 22 32 23 37" stroke="#EA580C" stroke-width="1.2" fill="none" stroke-linecap="round"/>
</svg>
